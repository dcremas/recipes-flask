{% extends "base.html" %}
{% block title %}{{ code }} — {{ site.name }}{% endblock %}

{% block content %}
<section class="section section--page">
  <div class="container narrow center">
    <p class="eyebrow">Error {{ code }}</p>
    <h2>{{ message }}</h2>
    <p class="section-tagline">Try the recipe collection, or head back to the start.</p>
    <div class="cta-row cta-row--center">
      <a class="btn btn--primary" href="{{ url_for('main.recipes') }}">Browse recipes</a>
      <a class="btn btn--ghost" href="{{ url_for('main.home') }}">Home</a>
    </div>
  </div>
</section>
{% endblock %}
