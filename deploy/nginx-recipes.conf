# recipes.dustincremascoli.com
#
# Install to /etc/nginx/conf.d/recipes.conf.
#
# This file is written for the post-certbot state. Before the certificate
# exists, nginx will not start with the TLS block present — so provision.sh
# installs the HTTP-only half first, runs certbot, and certbot writes the
# redirect. See deploy/README-deploy.md.

# Login and registration are the only endpoints worth brute-forcing. The zone
# is defined here and shared; 10m holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=recipes_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=recipes_all:10m rate=120r/m;

upstream recipes_app {
    server unix:/run/recipes/recipes.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name recipes.dustincremascoli.com;

    # certbot's webroot challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recipes.dustincremascoli.com;

    ssl_certificate     /etc/letsencrypt/live/recipes.dustincremascoli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipes.dustincremascoli.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000"              always;

    # Recipe text can be long; the app also caps bodies at 1 MB itself.
    # Photo uploads: must exceed Flask's MAX_CONTENT_LENGTH (12m) or nginx
    # rejects the request itself and Flask's 413 page never renders.
    client_max_body_size 14m;

    access_log /var/log/nginx/recipes.access.log;
    error_log  /var/log/nginx/recipes.error.log;

    # Static files are served by nginx directly — gunicorn never sees them.
    location /static/ {
        alias /home/ec2-user/recipes_flask/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded photos, served straight off disk. They live outside the app tree
    # (see photos.py) so deploy.sh's rsync --delete cannot erase them and the
    # unit's ProtectHome=read-only does not block writes. Filenames are
    # content-addressed, so immutable caching is safe.
    location /media/ {
        alias /var/lib/recipes/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://recipes_app;
        access_log off;
    }

    # Tight limit on the login endpoint — the only credential endpoint left
    # now that registration is gone. burst=5 absorbs a genuine fat-fingered
    # retry; nodelay means the burst is served immediately rather than queued.
    location = /login {
        limit_req zone=recipes_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_recipes.inc;
    }

    location / {
        limit_req zone=recipes_all burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_recipes.inc;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
